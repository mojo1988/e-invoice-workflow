services:
  e-invoice-eu:
    image: gflohr/e-invoice-eu:latest
    container_name: e-invoice-eu
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    networks:
      - invoice-net

  watcher:
    build:
      context: .
      dockerfile: watcher/Dockerfile
    container_name: e-invoice-watcher
    restart: unless-stopped
    depends_on:
      - e-invoice-eu
    environment:
      API_URL: http://e-invoice-eu:3000
      INPUT_DIR: /data/share/input
      OUTPUT_DIR: /data/share/output
      ARCHIVE_DIR: /data/share/archive
      ERROR_DIR: /data/error
      MAPPING_DIR: /data/mapping
      WORK_DIR: /data/work
      LOG_DIR: /data/logs
      FORMAT: Factur-X-EN16931
      SHEET_NAME: Tabelle1
      POLL_SECONDS: "10"
      STABLE_SECONDS: "10"
      REQUEST_TIMEOUT: "180"
    volumes:
      - /docker/volumes/e-invoice-workflow/data:/data
    networks:
      - invoice-net

networks:
  invoice-net:
    name: invoice-net
