name: e-invoice-workflow

services:
  e-invoice-eu:
    image: gflohr/e-invoice-eu:latest
    container_name: e-invoice-eu
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: Europe/Berlin
    expose:
      - "3000"
    networks:
      - invoice-net

  watcher:
    image: moj008/e-invoice-watcher:latest
    container_name: e-invoice-watcher
    restart: unless-stopped
    depends_on:
      - e-invoice-eu
    environment:
      TZ: Europe/Berlin
      API_URL: "http://e-invoice-eu:3000"
      INPUT_DIR: "/data/input"
      OUTPUT_DIR: "/data/output"
      ARCHIVE_DIR: "/data/archive"
      ERROR_DIR: "/data/error"
      MAPPING_DIR: "/data/mapping"
      WORK_DIR: "/data/work"
      LOG_DIR: "/data/logs"
      LOGO_PATH: "/data/assets/logo.png"
      FORMAT: "Factur-X-EN16931"
      SHEET_NAME: "Tabelle1"
      POLL_SECONDS: "10"
      STABLE_SECONDS: "10"
      REQUEST_TIMEOUT: "180"
    volumes:
    #Passe den Pfand an
      - /volume1/docker1/volumes/e-invoice-workflow/data:/data
    networks:
      - invoice-net

networks:
  invoice-net:
    name: invoice-net
